groups:
- name: go-users-application
  rules:
  - alert: HighErrorRate
    expr: rate(errors_total[5m]) > 0.1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

  - alert: HighResponseTime
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High response time detected"
      description: "95th percentile response time is {{ $value }}s"

  - alert: DatabaseConnectionExhaustion
    expr: db_connections_active / db_connections_max > 0.9
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Database connection pool nearly exhausted"
      description: "{{ $value | humanizePercentage }} of database connections are in use"

  - alert: HighMemoryUsage
    expr: memory_usage_high > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage detected"
      description: "Application memory usage is above threshold"

  - alert: ServiceDown
    expr: up{job="go-users-app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Go-Users service is down"
      description: "The Go-Users application is not responding"

  - alert: HighFailedLoginAttempts
    expr: rate(failed_login_attempts_total[5m]) > 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High number of failed login attempts"
      description: "{{ $value }} failed login attempts per second in the last 5 minutes"

  - alert: ActiveBruteforceAttacks
    expr: active_bruteforce_attacks > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Active brute force attacks detected"
      description: "{{ $value }} active brute force attacks are currently detected"

  - alert: PotentialDDoSDetected
    expr: potential_ddos_detected > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Potential DDoS attack detected"
      description: "Potential DDoS attack patterns have been detected"

- name: infrastructure
  rules:
  - alert: RedisDown
    expr: up{job="redis-exporter"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Redis is down"
      description: "Redis service is not responding"

  - alert: PostgreSQLDown
    expr: up{job="postgres-exporter"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "PostgreSQL is down"
      description: "PostgreSQL service is not responding"

  - alert: DiskSpaceLow
    expr: disk_space_low > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Disk space is running low"
      description: "Available disk space is below threshold"

- name: security
  rules:
  - alert: SuspiciousActivity
    expr: rate(suspicious_activity_detected_total[5m]) > 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Suspicious activity detected"
      description: "{{ $value }} suspicious activities detected per second"

  - alert: SecurityViolation
    expr: rate(security_violations_total[5m]) > 0.5
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Security violations detected"
      description: "{{ $value }} security violations detected per second"

  - alert: HighIPBlockRate
    expr: rate(ip_blocks_created_total[5m]) > 5
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High IP blocking rate"
      description: "{{ $value }} IP blocks created per second in the last 5 minutes" 